name: Accuracy log

# Monday 07:20 UTC, after a typical race weekend. Not on every push.
# OpenF1 calls are spaced 2.1s apart (free tier is 30 a minute) and capped at 240.
# Only the derived log and the static page are committed. Raw feeds are not stored.
on:
  schedule:
    - cron: "20 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: accuracy-log
  cancel-in-progress: false

jobs:
  update:
    name: Score completed races
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[api]"
      - run: python -m accuracy --season 2026 --source openf1
      - name: Commit the derived log
        run: |
          git diff --quiet -- accuracy/data/2026.json docs/accuracy/index.html && exit 0
          git config user.name "pitwall accuracy"
          git config user.email "actions@users.noreply.github.com"
          git add accuracy/data/2026.json docs/accuracy/index.html
          git commit -m "Update the public accuracy log"
          git push
